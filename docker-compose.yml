services:
  api:
    build: ./services/api
    environment:
      HOST: 0.0.0.0
    ports:
      - "127.0.0.1:4101:4101"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4101/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 15
  web:
    build: ./services/web
    environment:
      HOST: 0.0.0.0
      API_URL: http://api:4101
    ports:
      - "127.0.0.1:4100:4100"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 15
